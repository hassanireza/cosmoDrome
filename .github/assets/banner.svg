<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#100f0d"/>
      <stop offset="55%" stop-color="#16140f"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="rgba(127,143,122,0.16)"/>
      <stop offset="100%" stop-color="rgba(127,143,122,0)"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ded6c8"/>
      <stop offset="55%" stop-color="#a39c8e"/>
      <stop offset="100%" stop-color="#5c564a"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <rect width="1200" height="320" filter="url(#grain)" opacity="0.05"/>

  <g opacity="0.4">
    <circle cx="90" cy="60" r="1.4" fill="#ded6c8"/>
    <circle cx="180" cy="140" r="1" fill="#ded6c8"/>
    <circle cx="260" cy="40" r="1.5" fill="#ded6c8"/>
    <circle cx="1000" cy="70" r="1.4" fill="#ded6c8"/>
    <circle cx="1080" cy="180" r="1" fill="#ded6c8"/>
    <circle cx="940" cy="230" r="1.2" fill="#ded6c8"/>
    <circle cx="60" cy="250" r="1.2" fill="#ded6c8"/>
    <circle cx="330" cy="260" r="0.9" fill="#ded6c8"/>
    <circle cx="1140" cy="120" r="0.9" fill="#ded6c8"/>
  </g>

  <circle cx="1050" cy="90" r="46" fill="#7f8f7a" opacity="0.1"/>
  <circle cx="1050" cy="90" r="30" fill="#7f8f7a" opacity="0.16"/>

  <g transform="translate(150,160) scale(2.6)">
    <path d="M0 -9 L2.4 -4 L2.8 5.2 L1.2 7.6 L-1.2 7.6 L-2.8 5.2 L-2.4 -4 Z" fill="url(#hull)" stroke="#0a0908" stroke-width="0.5"/>
    <path d="M-2 -1.6 L-10.4 4.8 L-8 5.6 L-1.6 2.4 Z" fill="#48453c" stroke="#0a0908" stroke-width="0.4"/>
    <path d="M2 -1.6 L10.4 4.8 L8 5.6 L1.6 2.4 Z" fill="#5c564a" stroke="#0a0908" stroke-width="0.4"/>
    <ellipse cx="0" cy="-0.8" rx="1.4" ry="2.6" fill="#0a0908"/>
    <ellipse cx="-0.3" cy="-1.8" rx="0.65" ry="1" fill="#7f8f7a" opacity="0.85"/>
    <path d="M-3.6 6 L-3.6 10 L-1.4 6.6 Z" fill="rgba(127,143,122,0.6)"/>
    <path d="M3.6 6 L3.6 10 L1.4 6.6 Z" fill="rgba(127,143,122,0.6)"/>
  </g>

  <text x="380" y="158" font-family="'Cormorant Garamond', serif" font-style="italic" font-weight="500" font-size="66" fill="#ded6c8" letter-spacing="1">Cosmodrome</text>
  <text x="382" y="196" font-family="'Spectral', serif" font-style="italic" font-size="19" fill="#8a8377" letter-spacing="0.5">an endless drift through the dark</text>

  <rect x="382" y="222" width="46" height="1" fill="#7f8f7a"/>
  <text x="382" y="250" font-family="'JetBrains Mono', monospace" font-size="12" fill="#7f8f7a" letter-spacing="1.5">REACT / TYPESCRIPT / CANVAS 2D / OOP ENGINE</text>
</svg>
