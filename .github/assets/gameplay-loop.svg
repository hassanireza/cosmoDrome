<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="1100" height="340">
  <defs>
    <style>
      .node { fill: #16140f; stroke: #38332a; stroke-width: 1.3; }
      .nodeBoss { fill: #241612; stroke: #a06a52; stroke-width: 1.3; }
      .label { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #ded6c8; font-weight: 600; }
      .sub { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; fill: #8a8377; }
      .edge { stroke: #7f8f7a; stroke-width: 1.5; fill: none; }
      .edgeBoss { stroke: #a06a52; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7f8f7a"/>
    </marker>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a06a52"/>
    </marker>
  </defs>

  <rect width="1100" height="340" fill="#0a0908"/>
  <text x="30" y="36" font-family="'Cormorant Garamond', serif" font-style="italic" font-weight="500" font-size="18" fill="#ded6c8">sector loop</text>

  <rect x="30" y="70" width="180" height="76" rx="4" class="node"/>
  <text x="48" y="98" class="label">spawn obstacles</text>
  <text x="48" y="118" class="sub">asteroid, stone,</text>
  <text x="48" y="132" class="sub">scout, wreck</text>

  <path d="M210 108 L270 108" class="edge" marker-end="url(#arrow2)"/>

  <rect x="270" y="70" width="180" height="76" rx="4" class="node"/>
  <text x="288" y="98" class="label">dodge or destroy</text>
  <text x="288" y="118" class="sub">weapons: laser, twin,</text>
  <text x="288" y="132" class="sub">spread, missile</text>

  <path d="M450 108 L510 108" class="edge" marker-end="url(#arrow2)"/>

  <rect x="510" y="70" width="180" height="76" rx="4" class="node"/>
  <text x="528" y="98" class="label">sector progress</text>
  <text x="528" y="118" class="sub">clean pass or hop</text>
  <text x="528" y="132" class="sub">fills the quota bar</text>

  <path d="M690 108 L750 108" class="edge" marker-end="url(#arrow2)"/>

  <rect x="750" y="70" width="180" height="76" rx="4" class="node"/>
  <text x="768" y="98" class="label">quota reached</text>
  <text x="768" y="118" class="sub">speed steps up,</text>
  <text x="768" y="132" class="sub">palette shifts</text>

  <path d="M840 146 L840 200 L210 200 L210 146" class="edge" marker-end="url(#arrow2)" fill="none"/>
  <text x="440" y="216" class="sub" text-anchor="middle">repeat, difficulty ramps with each sector</text>

  <path d="M840 146 L840 250" class="edgeBoss" marker-end="url(#arrow3)"/>
  <text x="855" y="200" class="sub" fill="#a06a52">every 5th sector</text>

  <rect x="640" y="250" width="400" height="70" rx="4" class="nodeBoss"/>
  <text x="660" y="278" class="label">boss encounter</text>
  <text x="660" y="298" class="sub">Render Hulk, Vanguard Striker, Twin Sentinel, or Swarm Mother</text>
  <text x="660" y="312" class="sub">unique movement and fire pattern, then back to the sector loop</text>
</svg>
